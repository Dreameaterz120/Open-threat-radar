name: Update Threat Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Generate threat radar
        run: python main.py

      - name: Save updated dashboard
        run: |
          git config user.name "open-threat-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html docs/data.json

          if git diff --cached --quiet; then
            echo "No dashboard changes found."
          else
            git commit -m "Update threat radar"
            git push
          fi
